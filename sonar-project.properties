sonar.projectKey=portfolive
sonar.projectName=PortfoLive
sonar.sources=server/app,client/src
sonar.tests=server/tests
sonar.exclusions=**/node_modules/**,**/__pycache__/**
sonar.python.version=3.12
# Produced by the pipeline (docker build --target test-report) and path-fixed with sed
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.sourceEncoding=UTF-8
