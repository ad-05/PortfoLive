# LOCAL (docker compose) Prometheus config. The Kubernetes version is templated by Ansible
# (ansible/roles/k8s_bootstrap/templates/prometheus.yml.j2) and uses the same alert rules.
global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: [/etc/prometheus/alert-rules.yml]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
scrape_configs:
  - job_name: portfolive
    metrics_path: /metrics
    static_configs: [{ targets: ["app:4000"] }]
