# Sends alerts to Slack. The webhook URL is read from a file (a Kubernetes Secret in the cluster),
# so no secret is ever committed. Microsoft Teams: see docs/SETUP_GUIDE.md, "Using Microsoft Teams instead".
route:
  receiver: slack
  group_by: [alertname, instance]
  group_wait: 20s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:rotating_light:{{ else }}:white_check_mark:{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          severity: `{{ .Labels.severity }}`
          {{ end }}
inhibit_rules:
  - source_match: { severity: critical }
    target_match: { severity: warning }
    equal: [alertname, instance]
