# REFERENCE ONLY (never applied by the pipeline). Ansible creates the real Secret from
# ansible/group_vars/all/secrets.yml and the Terraform-generated terraform.yml.
apiVersion: v1
kind: Secret
metadata: { name: portfolive-secrets }
stringData:
  APP_ENV: production
  JWT_SECRET: at-least-32-random-characters
  STORAGE: s3
  S3_BUCKET: your-bucket
  CLOUDFRONT_DISTRIBUTION_ID: EXXXXXXXXXXXX   # "" when CloudFront is off
  CLOUDFRONT_URL: https://dxxxxxxxx.cloudfront.net   # or http://<bucket>.s3-website.<region>.amazonaws.com
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: from-terraform-output
  AWS_SECRET_ACCESS_KEY: from-terraform-output
  ADMIN_EMAIL: you@example.com
