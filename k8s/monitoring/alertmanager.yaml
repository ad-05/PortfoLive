# ConfigMap alertmanager-config and Secret alertmanager-slack (key: slack-webhook-url) are created by Ansible.
apiVersion: apps/v1
kind: Deployment
metadata: { name: alertmanager, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: alertmanager } }
  template:
    metadata: { labels: { app: alertmanager } }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
          ports: [{ containerPort: 9093 }]
          readinessProbe: { httpGet: { path: /-/ready, port: 9093 } }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 192Mi } }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml }
            - { name: slack, mountPath: /etc/alertmanager/secrets, readOnly: true }
            - { name: data, mountPath: /alertmanager }
      securityContext: { runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534 }
      volumes:
        - { name: config, configMap: { name: alertmanager-config } }
        - { name: slack, secret: { secretName: alertmanager-slack } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: alertmanager, namespace: monitoring }
spec:
  type: NodePort
  selector: { app: alertmanager }
  ports: [{ port: 9093, targetPort: 9093, nodePort: 30093 }]
