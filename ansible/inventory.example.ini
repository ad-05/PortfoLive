# Shape of the inventory that `terraform apply` generates as inventory.ini (do not edit that one by hand).
[jenkins]
jenkins-server ansible_host=203.0.113.10 private_ip=10.0.1.10

[sonarqube]
sonarqube-server ansible_host=203.0.113.11 private_ip=10.0.1.11

[k8s]
k3s-server ansible_host=203.0.113.12 private_ip=10.0.1.12

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/portfolive.pem
