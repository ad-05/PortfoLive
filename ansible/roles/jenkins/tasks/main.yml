- name: Remove old Jenkins source and key files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/apt/sources.list.d/jenkins.list
    - /etc/apt/keyrings/jenkins.gpg
    - /etc/apt/keyrings/jenkins-keyring.asc

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download and dearmor Jenkins 2026 GPG key
  ansible.builtin.shell: |
    curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key | gpg --dearmor -o /etc/apt/keyrings/jenkins.gpg

- name: Add Jenkins apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/jenkins.list
    content: "deb [signed-by=/etc/apt/keyrings/jenkins.gpg] https://pkg.jenkins.io/debian-stable binary/\n"
  register: jenkins_repo

- name: Update apt cache after adding Jenkins repo
  ansible.builtin.apt:
    update_cache: yes

- name: Install Java (Jenkins runtime)
  ansible.builtin.apt:
    name: openjdk-21-jre-headless
    state: present

- name: Install Jenkins
  ansible.builtin.apt:
    name: jenkins
    state: present

- name: Install kubectl at the pinned version
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"

- name: Let the jenkins user run docker (pipeline builds images and runs SonarScanner/ZAP as containers)
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  notify: Restart Jenkins

- name: Jenkins is enabled and running
  ansible.builtin.service:
    name: jenkins
    state: started
    enabled: true

- name: Apply pending restart now so the docker group takes effect
  ansible.builtin.meta: flush_handlers

- name: Wait for Jenkins to answer on port 8080
  ansible.builtin.uri:
    url: http://localhost:8080/login
    status_code: [200, 403]
  register: jenkins_up
  retries: 30
  delay: 10
  until: jenkins_up.status in [200, 403]

- name: Read the one-time Jenkins unlock password (only exists before first setup)
  ansible.builtin.slurp:
    src: /var/lib/jenkins/secrets/initialAdminPassword
  register: jenkins_admin_pw
  failed_when: false

- name: Show the Jenkins unlock password
  ansible.builtin.debug:
    msg: "Jenkins unlock password: {{ (jenkins_admin_pw.content | default('') | b64decode | trim) or 'already set up' }}"