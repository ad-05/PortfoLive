---
- name: Download Docker's official install script
  ansible.builtin.get_url:
    url: https://get.docker.com
    dest: /tmp/get-docker.sh
    mode: "0755"

- name: Install Docker Engine + Compose plugin
  ansible.builtin.command: sh /tmp/get-docker.sh
  args:
    creates: /usr/bin/docker

- name: Docker is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Let the ubuntu user run docker without sudo
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
